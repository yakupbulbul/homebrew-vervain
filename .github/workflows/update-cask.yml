name: Update cask

# Keeps the cask on the latest Vervain release without anyone doing it by hand.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump to the latest release
        run: scripts/bump-cask.sh

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/vervain.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump to Vervain ${version}"
          git push
